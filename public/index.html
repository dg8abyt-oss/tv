<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Dashboard</title>
    <link rel="icon" href="https://ik.imagekit.io/migbb/download.png" type="image/png">
    <style>
        :root {
            --bg-color: #d1f2d1;
            --text-color: #0a0f0a;
        }
        body { 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            overflow: hidden; 
        }
        .dashboard { text-align: center; transition: transform 0.3s ease; }
        #time { font-size: 12vw; font-weight: 800; letter-spacing: -3px; line-height: 1; }
        #weather { font-size: 3vw; font-weight: 500; margin-top: 1rem; opacity: 0.85; }
        #message-container { position: absolute; bottom: 15%; width: 90%; display: flex; justify-content: center; }
        #message { 
            font-size: 3.5vw; font-weight: 700; text-align: center; 
            background-color: var(--text-color); color: var(--bg-color);
            padding: 24px 48px; border-radius: 24px; box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            transform: translateY(40px) scale(0.95); opacity: 0;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #message.show { transform: translateY(0) scale(1); opacity: 1; }
        
        /* The Unlock Screen overlay */
        #audio-unlock {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.9); z-index: 9999; 
            display: flex; align-items: center; justify-content: center; cursor: pointer;
        }
        #audio-unlock h1 {
            color: var(--bg-color); background: var(--text-color); 
            padding: 20px 40px; border-radius: 15px; border: 2px solid var(--bg-color);
        }
    </style>
</head>
<body>
    <div id="audio-unlock">
        <h1>Tap TV Screen to Enable Sound</h1>
    </div>

    <div class="dashboard" id="dashboard">
        <div id="time">00:00 AM</div>
        <div id="weather">Fetching weather...</div>
    </div>
    <div id="message-container"><div id="message"></div></div>

    <script>
        const unlockOverlay = document.getElementById('audio-unlock');
        
        // This function forces the browser to allow audio
        unlockOverlay.addEventListener('click', () => {
            // Play a test sound to unlock the browser's audio engine
            const unlockSound = new Audio('https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=en&q=System+ready');
            unlockSound.play().catch(e => console.log("Audio unlock failed:", e));
            unlockOverlay.style.display = 'none'; // Hide overlay after clicking
        });

        function updateTime() {
            const now = new Date();
            document.getElementById('time').innerText = now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
        }
        setInterval(updateTime, 1000);
        updateTime();

        async function getWeather() {
            try {
                const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=40.5187&longitude=-74.4121&current_weather=true&temperature_unit=fahrenheit&windspeed_unit=mph');
                const data = await res.json();
                document.getElementById('weather').innerText = `${Math.round(data.current_weather.temperature)}°F • Wind: ${data.current_weather.windspeed} mph`;
            } catch (e) { document.getElementById('weather').innerText = 'Weather unavailable'; }
        }
        getWeather();
        setInterval(getWeather, 600000); 

        let msgTimeout;
        let lastMessageId = 0;
        const msgEl = document.getElementById('message');
        const dashboard = document.getElementById('dashboard');

        setInterval(async () => {
            try {
                const res = await fetch('/api/message');
                const data = await res.json();
                if (data.text && data.id !== lastMessageId) {
                    lastMessageId = data.id; 
                    msgEl.innerText = data.text;
                    msgEl.classList.add('show');
                    dashboard.style.transform = 'translateY(-5vh)'; 
                    
                    // Play the Cloud MP3 TTS
                    const ttsUrl = `https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=en&q=${encodeURIComponent(data.text)}`;
                    const msgAudio = new Audio(ttsUrl);
                    msgAudio.play().catch(e => console.log("TTS play failed:", e));
                    
                    clearTimeout(msgTimeout);
                    msgTimeout = setTimeout(() => { 
                        msgEl.classList.remove('show'); 
                        dashboard.style.transform = 'translateY(0)'; 
                    }, 8000); 
                }
            } catch (e) { console.error("Poll error", e); }
        }, 2000); 
    </script>
</body>
</html>
