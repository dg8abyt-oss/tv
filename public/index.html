<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TV Dashboard</title>
    <style>
        :root {
            var(--bg-color): #d1f2d1;
            var(--text-color): #0a0f0a;
        }

        body { 
            background-color: #d1f2d1; 
            color: #0a0f0a; 
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            overflow: hidden; 
        }

        .dashboard {
            text-align: center;
            transition: transform 0.3s ease;
        }

        #time { 
            font-size: 12vw; 
            font-weight: 800; 
            letter-spacing: -3px;
            line-height: 1;
        }

        #weather { 
            font-size: 3vw; 
            font-weight: 500; 
            margin-top: 1rem;
            opacity: 0.85; 
        }

        #message-container { 
            position: absolute;
            bottom: 15%;
            width: 90%;
            display: flex; 
            justify-content: center; 
        }

        #message { 
            font-size: 3.5vw; 
            font-weight: 700; 
            text-align: center; 
            background-color: #0a0f0a;
            color: #d1f2d1;
            padding: 24px 48px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            transform: translateY(40px) scale(0.95);
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #message.show {
            transform: translateY(0) scale(1);
            opacity: 1;
        }
    </style>
</head>
<body>
    
    <div class="dashboard" id="dashboard">
        <div id="time">00:00 AM</div>
        <div id="weather">Fetching weather...</div>
    </div>

    <div id="message-container">
        <div id="message"></div>
    </div>

    <script>
        // Time & Weather setup
        function updateTime() {
            const now = new Date();
            document.getElementById('time').innerText = now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
        }
        setInterval(updateTime, 1000);
        updateTime();

        async function getWeather() {
            try {
                const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=40.5187&longitude=-74.4121&current_weather=true&temperature_unit=fahrenheit&windspeed_unit=mph');
                const data = await res.json();
                document.getElementById('weather').innerText = `${Math.round(data.current_weather.temperature)}°F • Wind: ${data.current_weather.windspeed} mph`;
            } catch (e) {
                document.getElementById('weather').innerText = 'Weather currently unavailable';
            }
        }
        getWeather();
        setInterval(getWeather, 600000); 

        // Vercel Serverless Messaging System
        let msgTimeout;
        let lastMessageId = 0;
        const msgEl = document.getElementById('message');
        const dashboard = document.getElementById('dashboard');

        // Poll the API every 2 seconds
        setInterval(async () => {
            try {
                const res = await fetch('/api/message');
                const data = await res.json();
                
                // If there's a message AND the ID is new, display it
                if (data.text && data.id !== lastMessageId) {
                    lastMessageId = data.id; // Remember this message so we don't show it twice
                    
                    msgEl.innerText = data.text;
                    msgEl.classList.add('show');
                    dashboard.style.transform = 'translateY(-5vh)'; 
                    
                    clearTimeout(msgTimeout);
                    msgTimeout = setTimeout(() => { 
                        msgEl.classList.remove('show'); 
                        dashboard.style.transform = 'translateY(0)'; 
                    }, 8000); 
                }
            } catch (e) {
                console.error("Couldn't fetch message", e);
            }
        }, 2000); 
    </script>
</body>
</html>
